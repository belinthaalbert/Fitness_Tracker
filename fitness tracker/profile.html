<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack | Profile</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="profile">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>FitTrack</span>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></a>
          <a href="workouts.html" class="nav-link" data-page="workouts"><span class="nav-icon">🏋️</span><span>Workouts</span></a>
          <a href="nutrition.html" class="nav-link" data-page="nutrition"><span class="nav-icon">🥗</span><span>Nutrition</span></a>
          <a href="progress.html" class="nav-link" data-page="progress"><span class="nav-icon">📈</span><span>Progress</span></a>
          <a href="goals.html" class="nav-link" data-page="goals"><span class="nav-icon">🎯</span><span>Goals</span></a>
          <a href="profile.html" class="nav-link active" data-page="profile"><span class="nav-icon">👤</span><span>Profile</span></a>
          <a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span><span>Settings</span></a>
        </nav>

        <div class="sidebar-footer">
          <button class="btn btn-ghost btn-block" data-logout>Log out</button>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
            <div>
              <p class="eyebrow">Personal profile</p>
              <h1>Profile</h1>
            </div>
          </div>
          <div class="topbar-right">
            <div class="date-pill" id="currentDate"></div>
          </div>
        </header>

        <main class="page-content profile-page">
          <section class="profile-layout">
            <div class="panel profile-summary">
              <div class="profile-avatar-wrap">
                <div class="profile-avatar" id="profileAvatar">AB</div>
              </div>
              <div class="profile-summary-text">
                <h2 id="profileNameDisplay">Ava Brooks</h2>
                <p id="profileEmailDisplay">ava@example.com</p>
                <div class="chip-row">
                  <span id="profileGoalBadge">Fat loss</span>
                  <span id="profileActivityBadge">Moderate</span>
                </div>
              </div>
            </div>

            <div class="panel form-panel">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">Details</p>
                  <h2>Edit profile</h2>
                </div>
              </div>

              <form id="profileForm" class="stack-form" novalidate>
                <div class="field-grid two-col">
                  <div class="field">
                    <label for="profileName">Name</label>
                    <input id="profileName" type="text" required />
                  </div>
                  <div class="field">
                    <label for="profileEmail">Email</label>
                    <input id="profileEmail" type="email" required />
                  </div>
                </div>

                <div class="field-grid two-col">
                  <div class="field">
                    <label for="profileAge">Age</label>
                    <input id="profileAge" type="number" min="10" max="120" required />
                  </div>
                  <div class="field">
                    <label for="profileGender">Gender</label>
                    <select id="profileGender">
                      <option value="Female">Female</option>
                      <option value="Male">Male</option>
                      <option value="Non-binary">Non-binary</option>
                      <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                  </div>
                </div>

                <div class="field-grid two-col">
                  <div class="field">
                    <label for="profileHeight">Height (cm)</label>
                    <input id="profileHeight" type="number" min="100" max="250" required />
                  </div>
                  <div class="field">
                    <label for="profileWeight">Weight (kg)</label>
                    <input id="profileWeight" type="number" min="30" max="250" step="0.1" required />
                  </div>
                </div>

                <div class="field-grid two-col">
                  <div class="field">
                    <label for="profileActivityLevel">Activity level</label>
                    <select id="profileActivityLevel">
                      <option value="Sedentary">Sedentary</option>
                      <option value="Light">Light</option>
                      <option value="Moderate">Moderate</option>
                      <option value="High">High</option>
                      <option value="Athlete">Athlete</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="profileGoal">Fitness goal</label>
                    <select id="profileGoal">
                      <option value="Fat loss">Fat loss</option>
                      <option value="Muscle gain">Muscle gain</option>
                      <option value="Maintenance">Maintenance</option>
                      <option value="Performance">Performance</option>
                    </select>
                  </div>
                </div>

                <button class="btn btn-primary btn-block" type="submit">Save profile</button>
              </form>
              <div id="profileMessage" class="form-message" aria-live="polite"></div>
            </div>
          </section>

          <section class="profile-metrics">
            <article class="panel metric-panel">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">Body stats</p>
                  <h2>Health overview</h2>
                </div>
              </div>
              <div class="metric-list">
                <div class="metric-item"><span>BMI</span><strong id="bmiValue">0.0</strong></div>
                <div class="metric-item"><span>Daily calories</span><strong id="calorieNeedValue">0 kcal</strong></div>
                <div class="metric-item"><span>Goal</span><strong id="goalSummaryValue">Fat loss</strong></div>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
