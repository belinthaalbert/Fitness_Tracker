<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack | Goals</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="goals">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>FitTrack</span>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></a>
          <a href="workouts.html" class="nav-link" data-page="workouts"><span class="nav-icon">🏋️</span><span>Workouts</span></a>
          <a href="nutrition.html" class="nav-link" data-page="nutrition"><span class="nav-icon">🥗</span><span>Nutrition</span></a>
          <a href="progress.html" class="nav-link" data-page="progress"><span class="nav-icon">📈</span><span>Progress</span></a>
          <a href="goals.html" class="nav-link active" data-page="goals"><span class="nav-icon">🎯</span><span>Goals</span></a>
          <a href="profile.html" class="nav-link" data-page="profile"><span class="nav-icon">👤</span><span>Profile</span></a>
          <a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span><span>Settings</span></a>
        </nav>

        <div class="sidebar-footer">
          <button class="btn btn-ghost btn-block" data-logout>Log out</button>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
            <div>
              <p class="eyebrow">Goal setting</p>
              <h1>Goals</h1>
            </div>
          </div>
          <div class="topbar-right">
            <div class="date-pill" id="currentDate"></div>
          </div>
        </header>

        <main class="page-content goals-page">
          <section class="goal-layout">
            <div class="panel form-panel">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">New goal</p>
                  <h2>Create goal</h2>
                </div>
              </div>

              <form id="goalForm" class="stack-form" novalidate>
                <div class="field">
                  <label for="goalTitle">Goal title</label>
                  <input id="goalTitle" type="text" placeholder="Run 5k" required />
                </div>

                <div class="field-grid two-col">
                  <div class="field">
                    <label for="goalCategory">Category</label>
                    <select id="goalCategory">
                      <option value="Weight">Weight</option>
                      <option value="Steps">Steps</option>
                      <option value="Workout">Workout</option>
                      <option value="Calories">Calories</option>
                      <option value="Water">Water</option>
                      <option value="Custom">Custom</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="goalDeadline">Deadline</label>
                    <input id="goalDeadline" type="date" required />
                  </div>
                </div>

                <div class="field-grid two-col">
                  <div class="field">
                    <label for="goalTarget">Target value</label>
                    <input id="goalTarget" type="number" min="1" placeholder="5000" required />
                  </div>
                  <div class="field">
                    <label for="goalCurrent">Current value</label>
                    <input id="goalCurrent" type="number" min="0" placeholder="2400" required />
                  </div>
                </div>

                <button class="btn btn-primary btn-block" type="submit">Save goal</button>
              </form>
              <div id="goalMessage" class="form-message" aria-live="polite"></div>
            </div>

            <div class="panel goals-panel">
              <div class="panel-header">
                <div>
                  <p class="eyebrow">Progress</p>
                  <h2>Goal tracker</h2>
                </div>
              </div>
              <div id="goalList" class="goal-list"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/goals.js"></script>
  </body>
</html>
